# Website: test, build for https://adnane-giddah.github.io/ADNTism/ and publish to GitHub Pages.
name: Deploy website

on:
  push:
    branches: [main]
  # Redeploy after every app build so the site serves the newest APK.
  workflow_run:
    workflows: ['Build Android app']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --testTimeout=60000
      - run: npm run build:pages
      - name: Serve the latest Android app from the site itself (same-origin download)
        run: curl -fsSL -o dist/epsilon.apk https://github.com/${{ github.repository }}/releases/latest/download/epsilon.apk || echo "::warning::No APK release yet"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
