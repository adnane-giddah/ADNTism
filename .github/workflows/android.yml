# Android app: build the offline APK from the same source and attach it to a GitHub release as
# epsilon.apk, so the website's download link (releases/latest/download/epsilon.apk) always serves the newest.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'android/**', 'index.html', 'package.json', 'package-lock.json', 'capacitor.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app (bundled into the APK, root base, offline)
        run: npx vite build
      - run: npx cap sync android
      - name: Release key (from secrets, if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often carry a trailing newline or spaces; neither value contains whitespace.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
            pw=$(printf '%s' "$KEYSTORE_PW" | tr -d ' \r\n\t')
            echo "::add-mask::$pw"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            # Check the pair before the long build, with a clear message if they do not match.
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$pw" >/dev/null 2>&1; then
              echo "::error title=Signing secrets do not match::ANDROID_KEYSTORE_PASSWORD does not open ANDROID_KEYSTORE_BASE64. Re-paste both from C:\\Users\\lenovo\\epsilon-signing."
              exit 1
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APK is signed with a temporary debug key."
          fi
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface Gradle's own explanation as a visible annotation.
            msg=$(grep -A25 "What went wrong" gradle.log | head -40 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg:-see the log}"
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/epsilon.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: epsilon-apk
          path: epsilon.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: epsilon app 1.0.${{ github.run_number }}
          body: |
            Offline Android app for epsilon. Download **epsilon.apk**, open it and allow installing from your browser if asked.
            iPhone: open the website in Safari → Share → Add to Home Screen.
          files: epsilon.apk
          make_latest: true
